{% extends "base.html" %}
{% block title %}{{ code }} · MealGen{% endblock %}
{% block content %}
<div class="error-page">
  <div class="code">{{ code }}</div>
  <h2 style="margin: 16px 0 8px">{{ 'Nothing on the menu here' if code == 404 else 'Something’s off' }}</h2>
  <p class="muted">{{ message }}</p>
  <p style="margin-top: 24px"><a class="btn btn-dark" href="/">Back to home</a></p>
</div>
{% endblock %}
